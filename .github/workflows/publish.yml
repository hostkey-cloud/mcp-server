name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write # OIDC for npm Trusted Publishing
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm >= 11.5.1 (required for Trusted Publishing / OIDC).
      # registry-url is required by current npm docs; with id-token: write the
      # CLI uses OIDC and does not need NODE_AUTH_TOKEN / NPM_TOKEN secrets.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Ensure npm CLI supports Trusted Publishing
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck && npm run build

      # No NPM_TOKEN. Configure Trusted Publisher on npmjs.com first:
      # package → Settings → Trusted Publisher → GitHub Actions
      #   Organization: hostkey-cloud
      #   Repository: mcp-server
      #   Workflow filename: publish.yml
      #   Allowed actions: enable "npm publish" (not only stage)
      # Provenance is automatic with Trusted Publishing; --provenance is fine too.
      - run: npm publish --access public --provenance
